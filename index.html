<!DOCTYPE html> 
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="icon" href="./imagens/pikachu_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script defer src="./login.js"></script> 
    <title>Jogo da Memória Pokémon</title>
</head>
<body>
    <div class="particles" aria-hidden="true">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="card-glow"></div>

            <img src="./imagens/pokemon_logo.png" alt="Pokémon Logo" class="login-logo">

            <h1 class="login-title">Jogo da Memória</h1>
            <p class="login-subtitle">Teste sua memória e capture todos!</p>

            <form class="login_form">
                <div class="input-wrapper">
                    <span class="input-icon">⚡</span>
                    <input 
                        type="text" 
                        placeholder="Seu nome de treinador" 
                        class="login_input"
                        autocomplete="off"
                        maxlength="20"
                    >
                </div>

                <button type="submit" class="bt_login" disabled>
                    <span class="btn-text">INICIAR JOGO</span>
                    <span class="btn-icon">▶</span>
                </button>
            </form>

            <a href="./ranking.html" class="ranking-link">
                🏆 Ver Ranking
            </a>
        </div>

        <div class="pokeball-decoration" aria-hidden="true"></div>
    </div>
</body>
</html>
